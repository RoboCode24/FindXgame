<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Find the X!</h1>
  <div id="grid"></div>

  <p id="status"></p>

  <div id="controls">
    <button onclick="move('U')">⬆️ Up</button><br>
    <button onclick="move('L')">⬅️ Left</button>
    <button onclick="move('D')">⬇️ Down</button>
    <button onclick="move('R')">➡️ Right</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
